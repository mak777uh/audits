name: proofs

on:
  push:
    paths: ["proofs/**", "proof_market/**", "lakefile.lean", "lean-toolchain", ".github/workflows/proofs.yml"]
  pull_request:
    paths: ["proofs/**", "proof_market/**", "lakefile.lean", "lean-toolchain"]
  workflow_dispatch:

jobs:
  kernel-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan + Lean (версия из lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan.sh
          sh elan.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)" || true

      - name: lake build (одна библиотека, а не разрозненные файлы)
        run: lake build

      - name: Fail on sorry / admit
        run: |
          set -e
          if grep -nE '(^|[^A-Za-z_])(sorry|admit)([^A-Za-z_]|$)' proofs/*.lean; then
            echo "::error::proofs contain sorry/admit"; exit 1
          fi
          echo "no sorry/admit found"

      - name: Axiom audit (только propext / Classical.choice / Quot.sound)
        run: python3 proofs/axioms_check.py

      - name: Coverage matrix is up to date
        run: python3 proofs/coverage.py --check

      - name: Verifier receipt vectors (включая негативные)
        run: python3 proof_market/verifier.py --selftest

      - name: Cell escrow-v1 receipt is current
        run: python3 cells/escrow-v1/check.py --check

      - name: Cell escrow-v1 builds from scratch
        run: python3 cells/escrow-v1/check.py
